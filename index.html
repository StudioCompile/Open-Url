<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URL Launcher</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0e0e0e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #ddd;
      -webkit-font-smoothing: antialiased;
    }
    .box {
      background: #171717;
      border: 1px solid #262626;
      padding: 18px;
      width: 100%;
      max-width: 320px;
    }
    input[type="text"] {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      font-size: 0.85rem;
      font-family: inherit;
      border: 1px solid #2a2a2a;
      background: #0b0b0b;
      color: #eee;
      outline: none;
      transition: border-color 0.12s;
    }
    input[type="text"]::placeholder { color: #4a4a4a; }
    input[type="text"]:focus { border-color: #666; }

    .row { display: flex; align-items: stretch; gap: 6px; }
    .row input[type="text"] { flex: 1; }

    .icon-btn {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #2a2a2a;
      background: #1c1c1c;
      color: #888;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .icon-btn:hover { background: #232323; color: #ddd; border-color: #3a3a3a; }
    .icon-btn:active { background: #292929; }
    .icon-btn svg { width: 16px; height: 16px; display: block; }

    .error {
      color: #e05555;
      font-size: 0.72rem;
      margin: 8px 0 0;
      display: none;
    }

    .divider { border-top: 1px solid #262626; margin: 14px 0 10px; }

    .bm-list { max-height: 200px; overflow-y: auto; }

    .bm-item {
      display: flex;
      align-items: center;
      height: 34px;
      padding: 0 10px;
      font-size: 0.8rem;
      border: 1px solid #212121;
      margin-bottom: 5px;
      cursor: pointer;
      background: #121212;
      color: #ccc;
      transition: background 0.12s, border-color 0.12s;
    }
    .bm-item:last-child { margin-bottom: 0; }
    .bm-item:hover { background: #1a1a1a; border-color: #333; }

    .bm-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bm-actions { display: flex; }
    .bm-actions span {
      width: 22px;
      text-align: center;
      color: #555;
      cursor: pointer;
      font-size: 0.8rem;
      transition: color 0.12s;
    }
    .bm-actions span:hover { color: #e05555; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #2c2c2c; }
  </style>
</head>
<body>
<div class="box">
  <div class="row">
    <input type="text" id="urlInput" placeholder="https://example.com" />
    <button class="icon-btn" id="starBtn" type="button">
      <svg id="starIcon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M5 3h10a1 1 0 0 1 1 1v13l-6-3.5L4 17V4a1 1 0 0 1 1-1z"/>
      </svg>
    </button>
  </div>
  <div class="error" id="err">Invalid URL</div>

  <div class="divider"></div>
  <div class="bm-list" id="bmList"></div>
</div>
<script>
  const input = document.getElementById('urlInput');
  const err = document.getElementById('err');
  const starBtn = document.getElementById('starBtn');
  const starIcon = document.getElementById('starIcon');
  const bmList = document.getElementById('bmList');
  let bookmarks = [];

  function updateStarState() {
    const url = normalize(input.value);
    const active = url && bookmarks.some(b => b.url === url);
    starIcon.setAttribute('fill', active ? 'currentColor' : 'none');
  }

  function normalize(url) {
    url = url.trim();
    if (!url) return null;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch { return null; }
    return url;
  }

  function launch(url, mode) {
    if (mode === 'same') window.location.href = url;
    if (mode === 'tab') window.open(url, '_blank');
    if (mode === 'window') window.open(url, '_blank', 'width=1100,height=750');
  }

  function go() {
    const url = normalize(input.value);
    if (!url) { err.style.display = 'block'; return; }
    err.style.display = 'none';
    launch(url, 'same');
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') go();
  });

  input.addEventListener('input', () => { err.style.display = 'none'; updateStarState(); });

  async function loadBookmarks() {
    try {
      const res = await window.storage.get('bookmarks', false);
      bookmarks = res && res.value ? JSON.parse(res.value) : [];
    } catch {
      bookmarks = [];
    }
    renderBookmarks();
    updateStarState();
  }

  async function saveBookmarks() {
    try {
      await window.storage.set('bookmarks', JSON.stringify(bookmarks), false);
    } catch (e) {
      console.error('Failed to save bookmarks', e);
    }
  }

  function renderBookmarks() {
    bmList.innerHTML = '';
    bookmarks.forEach((b, i) => {
      const item = document.createElement('div');
      item.className = 'bm-item';

      const name = document.createElement('div');
      name.className = 'bm-name';
      name.textContent = b.name;
      item.appendChild(name);

      const actions = document.createElement('div');
      actions.className = 'bm-actions';

      const del = document.createElement('span');
      del.textContent = '✕';
      del.onclick = async (e) => {
        e.stopPropagation();
        bookmarks.splice(i, 1);
        renderBookmarks();
        updateStarState();
        await saveBookmarks();
      };
      actions.appendChild(del);

      item.appendChild(actions);
      item.onclick = () => { launch(b.url, 'same'); };
      bmList.appendChild(item);
    });
  }

  starBtn.addEventListener('click', async () => {
    const url = normalize(input.value);
    if (!url) { err.style.display = 'block'; return; }
    err.style.display = 'none';
    const idx = bookmarks.findIndex(b => b.url === url);
    if (idx >= 0) {
      bookmarks.splice(idx, 1);
    } else {
      const name = url.replace(/^https?:\/\//i, '').replace(/\/$/, '');
      bookmarks.unshift({ name, url });
    }
    renderBookmarks();
    updateStarState();
    await saveBookmarks();
  });

  loadBookmarks();
</script>
</body>
</html>
