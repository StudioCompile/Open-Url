<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URL Launcher</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0e0e0e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #ddd;
      -webkit-font-smoothing: antialiased;
    }
    .box {
      background: #171717;
      border: 1px solid #262626;
      border-radius: 4px;
      padding: 16px;
      width: 100%;
      max-width: 340px;
    }
    input[type="text"] {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      font-size: 0.85rem;
      font-family: inherit;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      background: #0b0b0b;
      color: #eee;
      outline: none;
      transition: border-color 0.12s;
    }
    input[type="text"]::placeholder { color: #4a4a4a; }
    input[type="text"]:focus { border-color: #666; }

    .error {
      color: #e05555;
      font-size: 0.72rem;
      margin: 8px 0 0;
      display: none;
    }

    .divider { border-top: 1px solid #262626; margin: 16px 0; }

    .bm-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tile {
      position: relative;
      width: 40px;
      height: 40px;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      background: #121212;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: background 0.12s, border-color 0.12s;
    }
    .tile:hover { background: #1c1c1c; border-color: #3a3a3a; }

    .tile img { width: 18px; height: 18px; }
    .tile .fallback {
      font-size: 0.8rem;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
    }

    .tile-overlay {
      position: absolute;
      top: 2px;
      right: 2px;
      display: none;
    }
    .tile:hover .tile-overlay { display: flex; }
    .tile-overlay span {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: #000000cc;
      color: #aaa;
      font-size: 0.55rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .tile-overlay span:hover { color: #fff; background: #000; }

    .add-tile {
      border-style: dashed;
      color: #666;
      font-size: 1.1rem;
      background: transparent;
    }
    .add-tile:hover { color: #ccc; }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: #171717;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 16px;
      width: 100%;
      max-width: 280px;
    }
    .modal h2 {
      font-size: 0.8rem;
      font-weight: 500;
      color: #999;
      margin: 0 0 12px;
      letter-spacing: 0.2px;
    }
    .modal-field-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .modal-preview {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      background: #0b0b0b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal-preview img { width: 18px; height: 18px; }
    .modal-preview .fallback {
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
    }
    .modal-field-row input { flex: 1; margin: 0; }
    .modal input[type="text"] { margin-bottom: 8px; }
    .modal .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .modal button {
      flex: 1;
      height: 32px;
      font-size: 0.75rem;
      font-family: inherit;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      background: #1c1c1c;
      color: #bbb;
      cursor: pointer;
    }
    .modal button:hover { background: #232323; }
    .modal button.primary { background: #2a2a2a; color: #eee; }
    .modal button.primary:hover { background: #333; }
    .modal button.danger:hover { color: #e05555; border-color: #4a2a2a; }
  </style>
</head>
<body>
<div class="box">
  <input type="text" id="urlInput" placeholder="https://example.com" />
  <div class="error" id="err">Invalid URL</div>

  <div class="divider"></div>

  <div class="bm-bar" id="bmBar"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">Add bookmark</h2>
    <div class="modal-field-row">
      <div class="modal-preview" id="modalPreview"><span class="fallback">?</span></div>
      <input type="text" id="modalUrl" placeholder="https://example.com" />
    </div>
    <input type="text" id="modalName" placeholder="Name" />
    <div class="modal-actions">
      <button id="modalSave" class="primary">Save</button>
      <button id="modalDelete" class="danger" style="display:none;">Delete</button>
      <button id="modalCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
  const input = document.getElementById('urlInput');
  const err = document.getElementById('err');
  const bmBar = document.getElementById('bmBar');

  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTitle = document.getElementById('modalTitle');
  const modalUrl = document.getElementById('modalUrl');
  const modalName = document.getElementById('modalName');
  const modalPreview = document.getElementById('modalPreview');
  const modalDelete = document.getElementById('modalDelete');

  let bookmarks = [];
  let editingIndex = null;

  function normalize(url) {
    url = (url || '').trim();
    if (!url) return null;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch { return null; }
    return url;
  }

  function launch(url) {
    window.location.href = url;
  }

  function go() {
    const url = normalize(input.value);
    if (!url) { err.style.display = 'block'; return; }
    err.style.display = 'none';
    launch(url);
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') go();
  });
  input.addEventListener('input', () => { err.style.display = 'none'; });

  async function loadBookmarks() {
    try {
      const res = await window.storage.get('bookmarks', false);
      bookmarks = res && res.value ? JSON.parse(res.value) : [];
    } catch {
      bookmarks = [];
    }
    renderBookmarks();
  }

  async function saveBookmarks() {
    try {
      await window.storage.set('bookmarks', JSON.stringify(bookmarks), false);
    } catch (e) {
      console.error('Failed to save bookmarks', e);
    }
  }

  function faviconUrl(url) {
    try {
      const host = new URL(url).hostname;
      return `https://www.google.com/s2/favicons?sz=64&domain=${host}`;
    } catch {
      return null;
    }
  }

  function setPreview(container, url, fallbackChar) {
    container.innerHTML = '';
    const fav = faviconUrl(url);
    if (fav) {
      const img = document.createElement('img');
      img.src = fav;
      img.alt = '';
      img.onerror = () => {
        img.remove();
        const span = document.createElement('span');
        span.className = 'fallback';
        span.textContent = fallbackChar;
        container.appendChild(span);
      };
      container.appendChild(img);
    } else {
      const span = document.createElement('span');
      span.className = 'fallback';
      span.textContent = fallbackChar;
      container.appendChild(span);
    }
  }

  function updateModalPreview() {
    const url = normalize(modalUrl.value);
    const fallback = (modalName.value || modalUrl.value || '?').trim().charAt(0) || '?';
    if (url) {
      setPreview(modalPreview, url, fallback);
    } else {
      modalPreview.innerHTML = `<span class="fallback">${fallback}</span>`;
    }
  }

  modalUrl.addEventListener('input', updateModalPreview);
  modalName.addEventListener('input', updateModalPreview);

  function openModal(mode, index) {
    editingIndex = mode === 'edit' ? index : null;
    if (mode === 'edit') {
      modalTitle.textContent = 'Edit bookmark';
      modalUrl.value = bookmarks[index].url;
      modalName.value = bookmarks[index].name;
      modalDelete.style.display = 'block';
    } else {
      modalTitle.textContent = 'Add bookmark';
      const prefill = normalize(input.value) || '';
      modalUrl.value = prefill;
      modalName.value = prefill ? prefill.replace(/^https?:\/\//i, '').replace(/\/$/, '') : '';
      modalDelete.style.display = 'none';
    }
    updateModalPreview();
    modalBackdrop.classList.add('open');
    modalUrl.focus();
  }

  function closeModal() {
    modalBackdrop.classList.remove('open');
    editingIndex = null;
  }

  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) closeModal();
  });

  document.getElementById('modalCancel').onclick = closeModal;

  document.getElementById('modalSave').onclick = async () => {
    const url = normalize(modalUrl.value);
    if (!url) { modalUrl.style.borderColor = '#e05555'; return; }
    modalUrl.style.borderColor = '';
    const name = modalName.value.trim() || url.replace(/^https?:\/\//i, '').replace(/\/$/, '');
    if (editingIndex !== null) {
      bookmarks[editingIndex] = { name, url };
    } else {
      bookmarks.push({ name, url });
    }
    closeModal();
    renderBookmarks();
    await saveBookmarks();
  };

  modalDelete.onclick = async () => {
    if (editingIndex === null) return;
    bookmarks.splice(editingIndex, 1);
    closeModal();
    renderBookmarks();
    await saveBookmarks();
  };

  function renderBookmarks() {
    bmBar.innerHTML = '';

    bookmarks.forEach((b, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.setAttribute('aria-label', b.name);
      setPreview(tile, b.url, (b.name || '?').charAt(0));

      const overlay = document.createElement('div');
      overlay.className = 'tile-overlay';
      const editSpan = document.createElement('span');
      editSpan.textContent = '✎';
      editSpan.onclick = (e) => { e.stopPropagation(); openModal('edit', i); };
      overlay.appendChild(editSpan);
      tile.appendChild(overlay);

      tile.onclick = () => launch(b.url);
      bmBar.appendChild(tile);
    });

    const addTile = document.createElement('div');
    addTile.className = 'tile add-tile';
    addTile.textContent = '+';
    addTile.setAttribute('aria-label', 'Add bookmark');
    addTile.onclick = () => openModal('add');
    bmBar.appendChild(addTile);
  }

  loadBookmarks();
</script>
</body>
</html>
